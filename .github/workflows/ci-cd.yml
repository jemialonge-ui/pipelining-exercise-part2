name: Build, Push,Test and Deploy Resume

on:
    #workflow_dispatch: # This allows you to manually trigger the workflow from the GitHub Actions tab
    push:
        branches: [ main, dev]
    pull_request:
        branches: [ main ]

permissions:
    contents: read
    id-token: write # This is required for AWS OIDC authentication

env:
    # Define any environment variables here
    # For example:
    # NODE_ENV: production
    # API_KEY: ${{ secrets.API_KEY }}
    # GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    AWS_REGION: us-east-1
    AWS_ACTIONS_ROLE_ARN: ${{ secrets.AWS_ACTIONS_ROLE_ARN }}
    ECR_REPO_NAME: dev-test
    IMAGE_TAG: ${{ github.run_number }}


jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: clone-repo
              uses: actions/checkout@v4

            - name: aws-credentials-config
              uses: aws-actions/configure-aws-credentials@v5
              with:
                role-to-assume: ${{ env.AWS_ACTIONS_ROLE_ARN }}
                aws-region: ${{ env.AWS_REGION }}

            - name: ECR_login
              uses: aws-actions/amazon-ecr-login@v1
              id:   ecr-login
            
            #- name: some-step
            #    uses: #some action
            #  with:
            #    token: ${{ secrets.GITHUB_TOKEN }}
            #- name: step5
            #  run: #some command
            #  with:
                #some parameters
            #    param1: value1
            #    param2: value2

    tag-and-push:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Build and Push Docker Image to ECR
              id:   build-and-push
              run:  |
                echo "pushing image to ECR"
                ls -laR
                docker build -t ${{ steps.ecr-login.outputs.ecr-registry }}${{ env.ECR_REPO_NAME }}:${{ env.IMAGE_TAG }} .
                docker tag ${{ steps.ecr-login.outputs.ecr-registry }}${{ env.ECR_REPO_NAME }}:${{ env.IMAGE_TAG }} ${{ steps.ecr-login.outputs.aws-account-id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPO_NAME }}:${{ env.IMAGE_TAG }}

                # Build your Docker image here
